version: "2"
sql:
  - schema: "internal/database/migrations"
    queries: "internal/database/queries"
    engine: "sqlite"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - column: "tasks.default_assignee"
            go_type:
              type: "sql.NullString"
          - column: "task_instances.original_scheduled_date"
            go_type:
              type: "sql.NullTime"
          - column: "task_instances.brought_forward_by"
            go_type:
              type: "sql.NullString"