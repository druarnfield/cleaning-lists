services:
  cleaning-scheduler:
    image: druarnfield/cleaning-scheduler:latest
    container_name: cleaning-scheduler
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persist database
      - cleaning_data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/cleaning.db
      - TZ=Australia/Brisbane  # Adjust to your timezone
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/login"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  cleaning_data:
    driver: local
