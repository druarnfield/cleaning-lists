services:
  cleaning-scheduler:
    image: druarnfield/cleaning-scheduler:latest
    container_name: cleaning-scheduler
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - cleaning_data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/cleaning.db
      - TZ=Australia/Brisbane
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/login"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    depends_on:
      - cleaning-scheduler

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_data:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email your-email@example.com --agree-tos --no-eff-email -d your-domain.com
    depends_on:
      - nginx

volumes:
  cleaning_data:
    driver: local
  certbot_data:
    driver: local
  letsencrypt:
    driver: local

networks:
  app-network:
    driver: bridge
