services:
  cleaning-scheduler:
    image: druarnfield/cleaning-scheduler:latest
    container_name: cleaning-scheduler
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - cleaning_data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/cleaning.db
      - TZ=Australia/Brisbane  # Adjust to your timezone
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/login"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - cleaning-scheduler

volumes:
  cleaning_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  app-network:
    driver: bridge
